[project]
name = "kuromaku-u"
version = "0.1.0"
description = "Kuromaku University — sample relational dataset + MCP server demo for the PE TechCast AI series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jim Milbery", email = "jim@parkergale.com" }]

dependencies = [
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/jmilbery/kuromaku-u"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
